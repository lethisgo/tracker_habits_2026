<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ritual</title>

<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>
:root{
  --morning:#fde68a;
  --afternoon:#93c5fd;
  --evening:#1e293b;
  --dark:#0b0d11;
}

body{
  margin:0;
  font-family:'DM Sans',sans-serif;
  background:var(--dark);
  color:white;
}

.app{max-width:420px;margin:auto;padding-bottom:40px}

/* HEADER */
.header{padding:30px 20px 10px}
.htitle{font-family:'Lora';font-size:26px}
.hsub{opacity:.6;font-size:13px}

/* TABS */
.tabs{display:flex;gap:8px;padding:10px 20px}
.tab{flex:1;padding:10px;border-radius:999px;border:1px solid #333;background:none;color:#aaa;cursor:pointer}
.tab.active{background:#fff;color:#000}

/* ROUTINE */
.routine{margin:16px;border-radius:22px;padding:18px;color:#222}
.morning{background:var(--morning)}
.afternoon{background:var(--afternoon)}
.evening{background:var(--evening);color:#fff}

.r-title{font-size:18px;font-weight:600;margin-bottom:10px}

/* STEP MODE */
.step{
  margin-top:20px;
  text-align:center;
}

.step-title{
  font-size:18px;
  margin-bottom:10px;
}

.step-btn{
  margin-top:20px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:12px;
  background:#111;
  color:white;
  cursor:pointer;
}

/* WEEK */
.week{display:flex;gap:6px;padding:20px}
.day{flex:1;height:50px;border-radius:6px;background:#222}
.day.fill{background:#22c55e}

/* MONTH */
.month-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  padding:20px;
}

.month-day{
  aspect-ratio:1;
  border-radius:5px;
  background:#222;
}

.l1{background:#4ade80}
.l2{background:#22c55e}
.l3{background:#15803d}

</style>

</head>

<body>

<div class="app">

<div class="header">
  <div class="htitle">Seu Ritual</div>
  <div class="hsub">consistência > intensidade</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="setView('day',event)">Hoje</button>
  <button class="tab" onclick="setView('week',event)">Semana</button>
  <button class="tab" onclick="setView('month',event)">Mês</button>
</div>

<div id="view-day"></div>
<div id="view-week" style="display:none"></div>
<div id="view-month" style="display:none"></div>

</div>

<script>
// ===== CONFIG =====

const AREAS = [
 {id:'corpo',label:'Corpo',period:'morning',habits:[
   {id:'treino',text:'Treinar'},
   {id:'agua',text:'Beber água'}
 ]},
 {id:'mente',label:'Mente',period:'morning',habits:[
   {id:'meditar',text:'Meditar'},
   {id:'ler',text:'Ler'}
 ]},
 {id:'casa',label:'Casa',period:'evening',habits:[
   {id:'arrumar',text:'Arrumar casa'}
 ]}
];

// ===== STATE =====

const TODAY = new Date().toISOString().slice(0,10);

let state = JSON.parse(localStorage.getItem('ritual_v3') || '{}');
if(!state.days) state.days = {};
if(!state.habits) state.habits = {};

if(!state.days[TODAY]){
  state.days[TODAY] = {};
}

function save(){
  localStorage.setItem('ritual_v3',JSON.stringify(state));
}

// ===== VIEW =====

function setView(v,e){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');

  document.getElementById('view-day').style.display = v==='day'?'block':'none';
  document.getElementById('view-week').style.display = v==='week'?'block':'none';
  document.getElementById('view-month').style.display = v==='month'?'block':'none';

  if(v==='week') renderWeek();
  if(v==='month') renderMonth();
}

// ===== STEP FLOW =====

let currentStep = 0;
let steps = [];

function buildSteps(){
  steps = [];

  AREAS.forEach(area=>{
    area.habits.forEach(h=>{
      steps.push({
        area:area.id,
        text:h.text
      });
    });
  });
}

function renderStep(){
  if(currentStep >= steps.length){
    document.getElementById('view-day').innerHTML = `
      <div class="step">
        <div class="step-title">Dia concluído 🎉</div>
      </div>`;
    return;
  }

  const s = steps[currentStep];

  document.getElementById('view-day').innerHTML = `
    <div class="routine morning">
      <div class="step">
        <div class="step-title">${s.text}</div>
        <button class="step-btn" onclick="completeStep()">Concluir</button>
      </div>
    </div>
  `;
}

function completeStep(){
  const s = steps[currentStep];

  if(!state.habits[TODAY]) state.habits[TODAY] = {};
  state.habits[TODAY][s.text] = true;

  currentStep++;
  save();
  renderStep();
}

// ===== WEEK =====

function dayTotal(date){
  const d = state.habits[date] || {};
  return Object.keys(d).length;
}

function renderWeek(){
  let html = '<div class="week">';
  for(let i=0;i<7;i++){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const total = dayTotal(key);

    html += `<div class="day ${total>0?'fill':''}"></div>`;
  }
  html += '</div>';
  document.getElementById('view-week').innerHTML = html;
}

// ===== MONTH =====

function renderMonth(){
  const now = new Date();
  const last = new Date(now.getFullYear(), now.getMonth()+1,0).getDate();

  let html = '<div class="month-grid">';
  for(let i=1;i<=last;i++){
    const d = new Date(now.getFullYear(),now.getMonth(),i);
    const key = d.toISOString().slice(0,10);
    const total = dayTotal(key);

    let lvl = total>=3?3:total>=2?2:total>=1?1:0;

    html += `<div class="month-day l${lvl}"></div>`;
  }
  html += '</div>';

  document.getElementById('view-month').innerHTML = html;
}

// INIT
buildSteps();
renderStep();

</script>

</body>
</html>
